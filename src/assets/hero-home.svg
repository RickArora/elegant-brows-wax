  <!-- Small leaves right of stem -->
  <path d="M 74 580 C 96 562 108 538 102 516 C 88 535 78 558 74 580 Z"
        fill="#C9A227" opacity="0.10" stroke="#C9A227" stroke-width="0.8" opacity="0.22"/>
  <path d="M 85 548 C 108 530 120 506 113 484 C 99 502 89 526 85 548 Z"
        fill="#C9A227" opacity="0.08" stroke="#C9A227" stroke-width="0.8" opacity="0.2"/>

  <!-- ── DECORATIVE BOTANICAL RIGHT ── -->
  <path d="M 650 650 C 645 600 635 555 620 520 C 610 495 600 475 590 458"
        stroke="#C9A227" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M 628 590 C 655 570 670 545 665 520 C 648 540 635 560 628 590 Z"
        fill="#C9A227" opacity="0.15" stroke="#C9A227" stroke-width="1" opacity="0.3"/>
  <path d="M 618 555 C 645 535 660 510 652 488 C 636 508 622 532 618 555 Z"
        fill="#C9A227" opacity="0.12" stroke="#C9A227" stroke-width="1" opacity="0.28"/>
  <path d="M 640 620 C 664 600 678 572 672 548 C 656 568 644 596 640 620 Z"
        fill="#C9A227" opacity="0.10" stroke="#C9A227" stroke-width="0.8" opacity="0.25"/>
  <path d="M 626 580 C 604 562 592 538 598 516 C 612 535 622 558 626 580 Z"
        fill="#C9A227" opacity="0.10" stroke="#C9A227" stroke-width="0.8" opacity="0.22"/>

  <!-- ── SPARKLES / STARS ── -->
  <!-- Large star top right -->
  <path d="M 590 175 L 593 165 L 596 175 L 606 178 L 596 181 L 593 191 L 590 181 L 580 178 Z"
