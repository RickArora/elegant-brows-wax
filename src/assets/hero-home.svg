<svg viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="hh-glow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hh-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow behind eye -->
  <ellipse cx="350" cy="430" rx="240" ry="160" fill="url(#hh-glow)"/>

  <!-- ── BROW ARCH ── -->
  <!-- Main arch -->
  <path d="M 100 390 C 160 280 250 230 350 225 C 450 220 540 268 600 360"
        stroke="#C9A227" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
  <!-- Highlight -->
  <path d="M 105 394 C 165 284 254 234 354 229 C 454 224 543 272 602 364"
        stroke="#E8C84A" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <!-- Shadow under arch -->
  <path d="M 102 396 C 162 286 252 236 352 231 C 452 226 542 274 601 366"
        stroke="#8B6914" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- ── EYE SHAPE ── -->
  <!-- Outer eye -->
  <path d="M 155 440 C 220 378 275 358 350 356 C 425 354 480 374 545 440
           C 480 504 425 522 350 522 C 275 522 220 502 155 440 Z"
        stroke="#C9A227" stroke-width="2" opacity="0.7"/>
  <!-- Inner lid line -->
  <path d="M 168 440 C 228 388 278 370 350 368 C 422 366 472 386 532 440"
        stroke="#C9A227" stroke-width="1" opacity="0.35"/>

  <!-- Iris -->
  <circle cx="350" cy="440" r="54" stroke="#C9A227" stroke-width="1.8" opacity="0.55"/>
  <circle cx="350" cy="440" r="38" stroke="#C9A227" stroke-width="1" opacity="0.35"/>
  <circle cx="350" cy="440" r="18" fill="url(#hh-iris)"/>
  <circle cx="350" cy="440" r="7" fill="#C9A227" opacity="0.28"/>
  <!-- Catchlight -->
  <circle cx="365" cy="428" r="5" fill="#F0D878" opacity="0.5"/>

  <!-- ── UPPER LASHES ── -->
  <line x1="200" y1="400" x2="188" y2="368" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="223" y1="385" x2="212" y2="352" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="248" y1="373" x2="240" y2="339" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  <line x1="275" y1="364" x2="270" y2="329" stroke="#C9A227" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <line x1="304" y1="359" x2="302" y2="323" stroke="#C9A227" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <line x1="332" y1="357" x2="333" y2="321" stroke="#C9A227" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="360" y1="357" x2="364" y2="321" stroke="#C9A227" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="388" y1="360" x2="394" y2="324" stroke="#C9A227" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <line x1="414" y1="365" x2="423" y2="330" stroke="#C9A227" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <line x1="439" y1="373" x2="451" y2="339" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  <line x1="462" y1="384" x2="476" y2="352" stroke="#C9A227" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <line x1="483" y1="397" x2="499" y2="368" stroke="#C9A227" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="502" y1="413" x2="520" y2="386" stroke="#C9A227" stroke-width="1" stroke-linecap="round" opacity="0.45"/>

  <!-- ── THREADING THREAD LINES ── (fine diagonal lines suggesting the thread) -->
  <path d="M 165 395 L 178 410" stroke="#E8C84A" stroke-width="0.8" opacity="0.4"/>
  <path d="M 181 384 L 196 400" stroke="#E8C84A" stroke-width="0.8" opacity="0.4"/>
  <path d="M 198 375 L 214 390" stroke="#E8C84A" stroke-width="0.8" opacity="0.35"/>

  <!-- ── DECORATIVE BOTANICAL LEFT ── -->
  <!-- Main stem -->
  <path d="M 50 650 C 55 600 65 555 80 520 C 90 495 100 475 110 458"
