  <!-- Small dots -->
  <circle cx="615" cy="210" r="2.5" fill="#C9A227" opacity="0.55"/>
  <circle cx="565" cy="155" r="1.8" fill="#E8C84A" opacity="0.5"/>
  <circle cx="140" cy="200" r="2.5" fill="#C9A227" opacity="0.45"/>
  <circle cx="110" cy="245" r="1.5" fill="#E8C84A" opacity="0.4"/>
  <circle cx="560" cy="220" r="1.5" fill="#C9A227" opacity="0.4"/>

  <!-- ── GEOMETRIC FRAME LINES ── -->
  <!-- Top horizontal hairline -->
  <line x1="150" y1="80" x2="550" y2="80" stroke="#C9A227" stroke-width="0.6" opacity="0.2"/>
  <!-- Corner marks -->
  <path d="M 150 80 L 150 100" stroke="#C9A227" stroke-width="0.8" opacity="0.3"/>
  <path d="M 550 80 L 550 100" stroke="#C9A227" stroke-width="0.8" opacity="0.3"/>
  <!-- Bottom arc -->
  <path d="M 200 790 C 280 760 420 760 500 790" stroke="#C9A227" stroke-width="0.8" stroke-linecap="round" opacity="0.2"/>

  <!-- ── FACE OUTLINE (very subtle) ── -->
  <ellipse cx="350" cy="480" rx="195" ry="240" stroke="#C9A227" stroke-width="0.7" opacity="0.08"/>

  <!-- ── CIRCULAR ORNAMENT (around eye area) ── -->
  <circle cx="350" cy="440" r="130" stroke="#C9A227" stroke-width="0.6" stroke-dasharray="4 8" opacity="0.15"/>
  <circle cx="350" cy="440" r="170" stroke="#C9A227" stroke-width="0.4" stroke-dasharray="2 12" opacity="0.1"/>
</svg>
